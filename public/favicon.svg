<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Speed streaks gradient -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#174BFF" />
    </linearGradient>
    <!-- Red star gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3848" />
      <stop offset="100%" stop-color="#C50711" />
    </linearGradient>
    <!-- Filter for slight glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Speed Streaks from the Star -->
  <path d="M34 16 H54 C56 16 56.5 14.5 55 14 L44 9 C42.5 8.5 41 9 40 10.5 L34 16 Z" fill="url(#streakGrad)" opacity="0.95" />
  <path d="M40 20 H58 C60 20 60.5 18.5 59 18 L50 14 C48.5 13.5 47 14 46 15.5 L40 20 Z" fill="url(#streakGrad)" opacity="0.8" />
  <path d="M44 24 H61 C62.5 24 62.5 23 61.5 22 L54 19 C52.5 18.5 51 19 50 20 L44 24 Z" fill="#174BFF" opacity="0.7" />

  <!-- Five-pointed Red Star -->
  <path
    d="M32 4 L39.8 20.3 L57.5 22.8 L44.7 35.3 L47.7 53 L32 44.5 L16.3 53 L19.3 35.3 L6.5 22.8 L24.2 20.3 Z"
    fill="url(#redGrad)"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
